<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duas Booklet — A Personal Collection</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <style>
    @font-face {
      font-family: 'Amiri';
      src: url('Amiri-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Amiri';
      src: url('Amiri-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
    :root {
      --bg: #f0ebe0;
      --surface: #ffffff;
      --surface2: #e8e2d5;
      --border: #cfc8b5;
      --accent: #2d6a4f;
      --accent-dim: #40916c;
      --accent-light: #d8f3dc;
      --accent-pill: #b7dfc4;
      --text: #1a1a1a;
      --text-dim: #4a5568;
      --text-muted: #9a8c7e;
      --arabic: #1b4332;
      --note-bg: #f6faf7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      background: var(--accent);
      padding: 20px 24px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(45,106,79,0.18);
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .bismillah {
      font-family: 'Times New Roman', serif;
      font-size: 19px;
      color: rgba(255,255,255,0.85);
      letter-spacing: 1px;
    }

    .header-titles { flex: 1; }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .subtitle {
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      margin-top: 2px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    #search {
      width: 100%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 9px 38px 9px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }

    #search:focus {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.55);
    }
    #search::placeholder { color: rgba(255,255,255,0.5); }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 15px;
      pointer-events: none;
    }

    .categories {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 11.5px;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .cat-btn:hover {
      background: rgba(255,255,255,0.22);
      color: #fff;
    }

    .cat-btn.active {
      background: #fff;
      border-color: #fff;
      color: var(--accent);
      font-weight: 600;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    .result-count {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 36px 0 14px;
      padding: 10px 14px;
      background: var(--accent);
      border-radius: 10px;
    }

    .section-header:first-child { margin-top: 0; }

    .section-icon {
      font-size: 17px;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-count {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      padding: 1px 8px;
      border-radius: 10px;
    }

    /* ── Dua card ── */
    .dua-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-dim);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 10px;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .dua-card:hover {
      box-shadow: 0 3px 14px rgba(45,106,79,0.10);
      border-color: var(--accent-dim);
    }

    .dua-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .dua-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .dua-source {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 4px;
      padding: 2px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .arabic {
      font-family: 'Amiri', 'Traditional Arabic', 'Arabic Typesetting', serif;
      font-size: 26px;
      color: var(--arabic);
      text-align: right;
      direction: rtl;
      line-height: 2.2;
      margin-bottom: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .transliteration {
      font-size: 12.5px;
      color: var(--accent-dim);
      font-style: italic;
      margin-bottom: 7px;
      line-height: 1.75;
    }

    .translation {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.7;
    }

    .dua-note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 9px 11px;
      border-radius: 6px;
      background: var(--note-bg);
      border: 1px solid #dceee2;
      line-height: 1.6;
    }

    .no-results {
      text-align: center;
      padding: 70px 20px;
      color: var(--text-muted);
    }

    .no-results .icon { font-size: 40px; margin-bottom: 12px; }
    .no-results p { font-size: 14px; }

    .group { display: block; }
    .dua-card.hidden { display: none; }

    footer {
      text-align: center;
      padding: 24px 20px;
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Mobile filter drawer — hidden on desktop ── */
    .mobile-filter-toggle,
    .mobile-filter-panel {
      display: none;
    }

    @media (max-width: 600px) {
      .arabic { font-size: 20px; }
      .dua-card { padding: 14px 16px; }
      h1 { font-size: 18px; }
      .header-top { gap: 10px; }
      .bismillah { font-size: 16px; }

      /* Hide the desktop pill row on mobile */
      .categories {
        display: none;
      }

      /* Show the mobile toggle */
      .mobile-filter-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 8px;
        padding: 8px 14px;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s;
        gap: 8px;
      }
      .mobile-filter-toggle:hover,
      .mobile-filter-toggle.open {
        background: rgba(255,255,255,0.2);
      }
      .mobile-filter-label {
        flex: 1;
        text-align: left;
        font-weight: 500;
      }
      .mobile-filter-chevron {
        font-size: 11px;
        opacity: 0.7;
        transition: transform 0.2s;
      }
      .mobile-filter-toggle.open .mobile-filter-chevron {
        transform: rotate(180deg);
      }

      /* Dropdown panel */
      .mobile-filter-panel {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 0 4px;
        animation: slideDown 0.18s ease;
      }
      .mobile-filter-panel.open {
        display: flex;
      }
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      /* Reuse cat-btn styles inside panel */
      .mobile-filter-panel .cat-btn {
        font-size: 11px;
        padding: 4px 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="bismillah">بِسْمِ اللَّهِ</div>
      <div class="header-titles">
        <h1>Duas Booklet</h1>
        <div class="subtitle">Authentic supplications from the Quran &amp; Sunnah</div>
      </div>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search by name, situation, keyword…" autocomplete="off" />
      <span class="search-icon">⌕</span>
    </div>

    <!-- Mobile-only collapsible filter -->
    <button class="mobile-filter-toggle" id="mobileFilterToggle" aria-expanded="false" aria-controls="mobileFilterPanel">
      <span class="mobile-filter-label" id="mobileFilterLabel">📋 All Categories</span>
      <span class="mobile-filter-chevron">▼</span>
    </button>
    <div class="mobile-filter-panel" id="mobileFilterPanel" role="listbox">
      <!-- buttons injected by JS -->
    </div>

    <div class="categories" id="categories">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="morning">🌅 Morning</button>
      <button class="cat-btn" data-cat="evening">🌙 Evening & Sleep</button>
      <button class="cat-btn" data-cat="prayer">🤲 Prayer</button>
      <button class="cat-btn" data-cat="hardship">💪 Hardship</button>
      <button class="cat-btn" data-cat="health">🩺 Health</button>
      <button class="cat-btn" data-cat="travel">✈️ Travel</button>
      <button class="cat-btn" data-cat="family">❤️ Family</button>
      <button class="cat-btn" data-cat="rizq">💼 Rizq & Career</button>
      <button class="cat-btn" data-cat="forgiveness">🌿 Forgiveness</button>
      <button class="cat-btn" data-cat="protection">🛡️ Protection</button>
      <button class="cat-btn" data-cat="daily">🏡 Daily Life</button>
      <button class="cat-btn" data-cat="quran">📖 Quranic Duas</button>
      <button class="cat-btn" data-cat="gratitude">🙏 Gratitude</button>
      <button class="cat-btn" data-cat="anxiety">😰 Fear & Anxiety</button>
      <button class="cat-btn" data-cat="grief">🕊️ Grief & Death</button>
      <button class="cat-btn" data-cat="sinning">💧 After Sinning</button>
      <button class="cat-btn" data-cat="social">🤝 Social Life</button>
      <button class="cat-btn" data-cat="tahajjud">🌃 Night Prayer</button>
      <button class="cat-btn" data-cat="istikhara">🎯 Istikhara</button>
      <button class="cat-btn" data-cat="ramadan">☪️ Ramadan & Fasting</button>
      <button class="cat-btn" data-cat="hajj">🕋 Hajj & Umrah</button>
      <button class="cat-btn" data-cat="salawat">💛 Salawat</button>
      <button class="cat-btn" data-cat="children">👶 Children</button>
      <button class="cat-btn" data-cat="study">📚 Knowledge & Study</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="result-count" id="result-count"></div>
  <div id="content"></div>
</main>

<footer>
  May Allah accept our duas and grant us guidance. آمين
</footer>

    title: "After a Study Session or Class",
    arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ",
    transliteration: "Subhanakallahumma wa bihamdika ash-hadu alla ilaha illa anta astaghfiruka wa atoobu ilayk",
    translation: "How perfect You are O Allah, and I praise You. I bear witness that there is no deity but You. I seek Your forgiveness and turn to You in repentance.",
    source: "Abu Dawud / Tirmidhi",
    note: "The kaffaratul majlis — expiation of a sitting — said at the end of any study circle or class. It seals the session and seeks forgiveness for any errors in what was said or understood."
  }

];

// ─── SECTIONS ─────────────────────────────────────────────────────
const SECTIONS = [
  { id: "morning",    label: "Morning Adhkar",          icon: "🌅" },
  { id: "evening",    label: "Evening & Sleep",          icon: "🌙" },
  { id: "prayer",     label: "Prayer (Salah)",           icon: "🤲" },
  { id: "hardship",   label: "Hardship & Distress",      icon: "💪" },
  { id: "anxiety",    label: "Fear & Anxiety",           icon: "😰" },
  { id: "grief",      label: "Grief & Death",            icon: "🕊️" },
  { id: "sinning",    label: "After Sinning",            icon: "💧" },
  { id: "health",     label: "Health & Cure",            icon: "🩺" },
  { id: "travel",     label: "Travel & Daily Movement",  icon: "✈️" },
  { id: "family",     label: "Family & Marriage",        icon: "❤️" },
  { id: "rizq",       label: "Rizq, Career & Debt",      icon: "💼" },
  { id: "forgiveness",label: "Forgiveness & Repentance", icon: "🌿" },
  { id: "gratitude",  label: "Gratitude (Shukr)",        icon: "🙏" },
  { id: "social",     label: "Social Life",              icon: "🤝" },
  { id: "tahajjud",   label: "Night Prayer (Tahajjud)",  icon: "🌃" },
  { id: "istikhara",  label: "Istikhara",                icon: "🎯" },
  { id: "ramadan",    label: "Ramadan & Fasting",        icon: "☪️" },
  { id: "hajj",       label: "Hajj & Umrah",             icon: "🕋" },
  { id: "salawat",    label: "Salawat on the Prophet ﷺ", icon: "💛" },
  { id: "children",   label: "Children & Newborns",      icon: "👶" },
  { id: "study",      label: "Knowledge & Study",        icon: "📚" },
  { id: "protection", label: "Protection",               icon: "🛡️" },
  { id: "daily",      label: "Daily Life",               icon: "🏡" },
  { id: "quran",      label: "Quranic Duas & Special",   icon: "📖" },
];

let activeCategory = "all";
let searchQuery = "";

function renderDua(dua) {
  const hasArabic = /[؀-ۿ]/.test(dua.arabic);
  return `
    <div class="dua-card" data-id="${dua.id}" data-cat="${dua.cat}">
      <div class="dua-header">
        <span class="dua-title">${dua.title}</span>
        <span class="dua-source">${dua.source}</span>
      </div>
      ${hasArabic ? `<div class="arabic">${dua.arabic}</div>` : ''}
      <div class="transliteration">${dua.transliteration}</div>
      <div class="translation">${dua.translation}</div>
      ${dua.note ? `<div class="dua-note">📌 ${dua.note}</div>` : ""}
    </div>
  `;
}

function render() {
  const content = document.getElementById("content");
  const resultCount = document.getElementById("result-count");
  const q = searchQuery.toLowerCase().trim();

  if (q) {
    // Flat search mode
    const results = DUAS.filter(d =>
      d.title.toLowerCase().includes(q) ||
      d.translation.toLowerCase().includes(q) ||
      d.transliteration.toLowerCase().includes(q) ||
      d.arabic.includes(q) ||
      (d.note && d.note.toLowerCase().includes(q)) ||
      d.source.toLowerCase().includes(q)
    );
    resultCount.textContent = `${results.length} result${results.length !== 1 ? "s" : ""} for "${searchQuery}"`;
    if (results.length === 0) {
      content.innerHTML = `<div class="no-results"><div class="icon">🔍</div><p>No duas found for that search. Try a different word.</p></div>`;
    } else {
      content.innerHTML = results.map(renderDua).join("");
    }
    return;
  }

  // Category / section mode
  const filteredSections = SECTIONS.filter(s => activeCategory === "all" || s.id === activeCategory);
  let totalVisible = 0;
  let html = "";

  filteredSections.forEach(section => {
    const duas = DUAS.filter(d => d.cat === section.id);
    if (duas.length === 0) return;
    totalVisible += duas.length;
    html += `
      <div class="section-header">
        <div class="section-icon">${section.icon}</div>
        <span class="section-title">${section.label}</span>
        <span class="section-count">${duas.length} duas</span>
      </div>
      ${duas.map(renderDua).join("")}
    `;
  });

  resultCount.textContent = `Showing ${totalVisible} duas`;
  content.innerHTML = html;
}

// Search input
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  if (searchQuery) {
    // Deactivate desktop category buttons during search
    document.querySelectorAll("#categories .cat-btn").forEach(b => b.classList.remove("active"));
  } else {
    document.querySelectorAll(`#categories [data-cat="${activeCategory}"]`).forEach(b => b.classList.add("active"));
    if (window._updateMobileLabel) window._updateMobileLabel(activeCategory);
  }
  render();
});

// ── Desktop category buttons ─────────────────────────────────────
document.getElementById("categories").addEventListener("click", e => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  selectCategory(btn.dataset.cat);
});

// ── Mobile filter drawer ──────────────────────────────────────────
(function buildMobilePanel() {
  const panel  = document.getElementById("mobileFilterPanel");
  const toggle = document.getElementById("mobileFilterToggle");
  const label  = document.getElementById("mobileFilterLabel");

  // Populate panel with the same buttons
  const all = [{ cat:"all", text:"📋 All Categories" }].concat(
    SECTIONS.map(s => ({ cat: s.id, text: s.icon + " " + s.label }))
  );
  panel.innerHTML = all.map(item =>
    `<button class="cat-btn${item.cat === "all" ? " active" : ""}" data-cat="${item.cat}">${item.text}</button>`
  ).join("");

  // Toggle open/close
  toggle.addEventListener("click", () => {
    const isOpen = panel.classList.toggle("open");
    toggle.classList.toggle("open", isOpen);
    toggle.setAttribute("aria-expanded", isOpen);
  });

  // Select from panel
  panel.addEventListener("click", e => {
    const btn = e.target.closest(".cat-btn");
    if (!btn) return;
    selectCategory(btn.dataset.cat);
    // Close panel after pick
    panel.classList.remove("open");
    toggle.classList.remove("open");
    toggle.setAttribute("aria-expanded", "false");
  });

  // Keep label in sync
  window._updateMobileLabel = function(cat) {
    const item = all.find(i => i.cat === cat);
    label.textContent = item ? item.text : "📋 All Categories";
    panel.querySelectorAll(".cat-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.cat === cat)
    );
  };
})();

function selectCategory(cat) {
  activeCategory = cat;
  searchQuery = "";
  document.getElementById("search").value = "";
  // Desktop buttons
  document.querySelectorAll("#categories .cat-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.cat === cat)
  );
  // Mobile label + panel highlight
  if (window._updateMobileLabel) window._updateMobileLabel(cat);
  render();
}

// Initial render
render();
</script>
</body>
</html>
